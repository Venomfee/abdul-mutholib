<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>HPP PRO - Kalkulator HPP Produk</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:22px 16px;position:sticky;top:0;z-index:10}
.header-inner{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#d1d5db;font-size:13px}
.container{max-width:1000px;margin:18px auto;padding:0 12px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px rgba(0,0,0,.06)}
h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
label{font-size:12px;font-weight:700;color:#4b5563;display:block;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;background:#fff}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}
.btn{background:#111827;color:#fff}.btn2{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f9fafb}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border-radius:12px;background:#f9fafb;border:1px solid #e5e7eb}.stat small{color:#6b7280}.stat strong{display:block;font-size:18px;margin-top:4px}
.price{font-size:26px!important;font-weight:800;color:#065f46}
.saved{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.saved-item{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.saved-item strong{display:block}.muted{color:#6b7280;font-size:12px}
@media(max-width:700px){.grid,.stats,.saved{grid-template-columns:1fr}.header-inner{align-items:flex-start;flex-direction:column}.container{padding:0 10px}}
@media print{header,.actions,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<header><div class="header-inner"><div><h1>HPP PRO</h1><p>Kalkulator Harga Pokok Produksi & Harga Jual</p></div><button class="btn2" onclick="newProduct()">＋ Produk Baru</button></div></header>

<div class="container">
<div class="card">
<h2>1. Informasi Produk</h2>
<div class="grid">
<div><label>NAMA PRODUK</label><input id="productName" placeholder="Contoh: Chicken Pop Fries"></div>
<div><label>HASIL PRODUKSI (PCS/PORSI)</label><input id="yield" type="number" min="1" value="1"></div>
</div>
</div>

<div class="card">
<h2>2. Bahan Baku</h2>
<div class="table-wrap">
<table><thead><tr><th>Nama Bahan</th><th>Harga Beli (Rp)</th><th>Isi/Qty Beli</th><th>Pemakaian</th><th>Satuan</th><th>Biaya (Rp)</th><th></th></tr></thead>
<tbody id="ingredients"></tbody></table>
</div>
<div class="actions no-print"><button class="btn" onclick="addIngredient()">＋ Tambah Bahan</button></div>
</div>

<div class="card">
<h2>3. Biaya Tambahan</h2>
<div class="grid">
<div><label>KEMASAN TOTAL (Rp)</label><input id="packaging" type="number" value="0"></div>
<div><label>GAS / LISTRIK (Rp)</label><input id="utilities" type="number" value="0"></div>
<div><label>TENAGA KERJA (Rp)</label><input id="labor" type="number" value="0"></div>
<div><label>BIAYA LAIN-LAIN (Rp)</label><input id="other" type="number" value="0"></div>
<div><label>BIAYA SUSUT / WASTE (%)</label><input id="waste" type="number" value="0" min="0"></div>
<div><label>TARGET KEUNTUNGAN (%)</label><input id="profit" type="number" value="30" min="0"></div>
</div>
</div>

<div class="card">
<h2>4. Hasil Perhitungan</h2>
<div class="stats">
<div class="stat"><small>Total Bahan</small><strong id="totalIngredients">Rp0</strong></div>
<div class="stat"><small>Total Biaya</small><strong id="totalCost">Rp0</strong></div>
<div class="stat"><small>HPP / Porsi</small><strong id="hpp">Rp0</strong></div>
<div class="stat"><small>Laba / Porsi</small><strong id="profitValue">Rp0</strong></div>
</div>
<div style="margin-top:14px"><label>REKOMENDASI HARGA JUAL / PORSI</label><input id="sellingPrice" class="price" readonly></div>
<div class="actions no-print">
<button class="btn" onclick="calculate()">Hitung HPP</button>
<button class="btn" onclick="saveProduct()">💾 Simpan Produk</button>
<button class="btn2" onclick="window.print()">🖨 Cetak</button>
<button class="btn2" onclick="exportData()">⬇ Export Data</button>
<button class="btn2" onclick="importData()">⬆ Import Data</button>
<button class="danger" onclick="clearForm()">Reset</button>
</div>
</div>

<div class="card no-print">
<h2>5. Produk Tersimpan</h2>
<div id="savedProducts" class="saved"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const money=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');
let ingredients=[];

function addIngredient(data={name:'',price:0,qty:1,use:0,unit:'gram'}){
 ingredients.push({...data}); renderIngredients();
}
function removeIngredient(i){ingredients.splice(i,1);renderIngredients();calculate();}
function renderIngredients(){
 $('ingredients').innerHTML=ingredients.map((x,i)=>`<tr>
<td><input value="${esc(x.name)}" oninput="ingredients[${i}].name=this.value"></td>
<td><input type="number" value="${x.price}" oninput="ingredients[${i}].price=+this.value;calculate()"></td>
<td><input type="number" value="${x.qty}" min="0.0001" oninput="ingredients[${i}].qty=+this.value;calculate()"></td>
<td><input type="number" value="${x.use}" min="0" oninput="ingredients[${i}].use=+this.value;calculate()"></td>
<td><select onchange="ingredients[${i}].unit=this.value">
${['gram','kg','ml','liter','pcs','sachet','botol','lainnya'].map(u=>`<option ${x.unit==u?'selected':''}>${u}</option>`).join('')}</select></td>
<td><strong>${money(cost(x))}</strong></td>
<td><button class="danger" onclick="removeIngredient(${i})">×</button></td></tr>`).join('');
}
function cost(x){return x.qty>0 ? x.price*(x.use/x.qty):0}
function calculate(){
 let base=ingredients.reduce((s,x)=>s+cost(x),0);
 let waste=base*(+$('waste').value||0)/100;
 let total=base+waste+(+$('packaging').value||0)+(+$('utilities').value||0)+(+$('labor').value||0)+(+$('other').value||0);
 let y=Math.max(1,+$('yield').value||1);
 let hpp=total/y, margin=(+$('profit').value||0)/100;
 let sell=hpp*(1+margin), pv=sell-hpp;
 $('totalIngredients').textContent=money(base);
 $('totalCost').textContent=money(total);
 $('hpp').textContent=money(hpp);
 $('profitValue').textContent=money(pv);
 $('sellingPrice').value=money(sell);
 renderIngredients();
 return {base,waste,total,y,hpp,sell,pv};
}
function getData(){
 calculate();
 return {name:$('productName').value||'Tanpa Nama',yield:+$('yield').value||1,ingredients,
 packaging:+$('packaging').value||0,utilities:+$('utilities').value||0,labor:+$('labor').value||0,other:+$('other').value||0,waste:+$('waste').value||0,profit:+$('profit').value||0,updated:new Date().toISOString()};
}
function saveProduct(){
 let d=getData(), list=JSON.parse(localStorage.getItem('hpp_products')||'[]');
 let idx=list.findIndex(x=>x.name.toLowerCase()===d.name.toLowerCase());
 if(idx>=0) list[idx]=d; else list.push(d);
 localStorage.setItem('hpp_products',JSON.stringify(list)); renderSaved();
 alert('Produk berhasil disimpan di perangkat.');
}
function loadProduct(i){
 let d=JSON.parse(localStorage.getItem('hpp_products')||'[]')[i]; if(!d)return;
 $('productName').value=d.name;$('yield').value=d.yield;ingredients=d.ingredients||[];
 $('packaging').value=d.packaging;$('utilities').value=d.utilities;$('labor').value=d.labor;$('other').value=d.other;$('waste').value=d.waste;$('profit').value=d.profit;
 renderIngredients();calculate();scrollTo(0,0);
}
function deleteProduct(i){
 let list=JSON.parse(localStorage.getItem('hpp_products')||'[]');list.splice(i,1);localStorage.setItem('hpp_products',JSON.stringify(list));renderSaved();
}
function renderSaved(){
 let list=JSON.parse(localStorage.getItem('hpp_products')||'[]');
 $('savedProducts').innerHTML=list.length?list.map((x,i)=>`<div class="saved-item"><strong>${esc(x.name)}</strong><div class="muted">HPP terakhir: ${money(calcSaved(x).hpp)}</div><div class="actions"><button class="btn2" onclick="loadProduct(${i})">Buka</button><button class="danger" onclick="deleteProduct(${i})">Hapus</button></div></div>`).join(''):'<div class="muted">Belum ada produk tersimpan.</div>';
}
function calcSaved(x){
 let b=(x.ingredients||[]).reduce((s,a)=>s+cost(a),0),t=b+b*(x.waste||0)/100+(x.packaging||0)+(x.utilities||0)+(x.labor||0)+(x.other||0);
 return {hpp:t/Math.max(1,x.yield||1)}
}
function newProduct(){clearForm();scrollTo(0,0)}
function clearForm(){
 $('productName').value='';$('yield').value=1;ingredients=[];
 ['packaging','utilities','labor','other','waste'].forEach(id=>$(id).value=0);$('profit').value=30;
 addIngredient();addIngredient();calculate();
}
function exportData(){
 let blob=new Blob([localStorage.getItem('hpp_products')||'[]'],{type:'application/json'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HPP_PRO_backup.json';a.click();
}
function importData(){
 let inp=document.createElement('input');inp.type='file';inp.accept='.json';
 inp.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;localStorage.setItem('hpp_products',JSON.stringify(x));renderSaved();alert('Data berhasil diimpor.')}catch{alert('File tidak valid.')}};r.readAsText(f)};inp.click();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
['yield','packaging','utilities','labor','other','waste','profit'].forEach(id=>$(id).addEventListener('input',calculate));
clearForm();renderSaved();
</script>
</body>
</html>
